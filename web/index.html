<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Linux 命令大全</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="list-page">
  <header class="topbar">
    <h1>Linux 命令大全</h1>
    <span class="count" id="cmd-count"></span>
  </header>
  <div class="search-wrap">
    <div class="search-box">
      <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5A4.5 4.5 0 0 1 9.5 14"/></svg>
      <input id="search" type="search" placeholder="搜索命令或功能，如 ls / 压缩 / 网络" autocomplete="off" autofocus>
      <button id="clear-btn" type="button" aria-label="清空">&times;</button>
    </div>
  </div>
  <div class="tips" id="tips">
    <span class="tip-chip" data-q="文件">文件</span>
    <span class="tip-chip" data-q="压缩">压缩</span>
    <span class="tip-chip" data-q="网络">网络</span>
    <span class="tip-chip" data-q="磁盘">磁盘</span>
    <span class="tip-chip" data-q="进程">进程</span>
    <span class="tip-chip" data-q="用户">用户</span>
    <span class="tip-chip" data-q="权限">权限</span>
    <span class="tip-chip" data-q="文本">文本</span>
  </div>
  <ul id="cmd-list" class="cmd-list"></ul>
  <div id="empty" class="empty" hidden>
    <p>没有找到匹配的命令</p>
    <button onclick="resetSearch()">显示全部</button>
  </div>
  <footer class="foot">内容来自 <b>jaywcjlove/linux-command</b> 开源项目 · 离线可用</footer>
</div>
<div id="detail-page" hidden>
  <header class="topbar detail-bar">
    <button id="back-btn" aria-label="返回">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8l8 8l1.41-1.41L7.83 13H20z"/></svg>
    </button>
    <h1 id="detail-title"></h1>
  </header>
  <article id="detail-body" class="md-body"></article>
</div>
<script src="marked.min.js"></script>
<script src="app-data.js"></script>
<script src="app.js"></script>
</body>
</html>
